name: Discord - nuova versione
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.repository == 'MekilliDoMaNi/Cyno-DS4-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Notifica la versione nel canale Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/scripts/notify_discord.py